plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.12'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation(project(':pandorical'))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.register('syncServer', Copy) {
	dependsOn build
	from("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
	into('/Users/chase.whitfield/Projects/village-server/mods')
	description = 'Deploy dirt-slab JAR to the local dev server mods folder.'
}
